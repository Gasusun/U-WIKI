<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NTTU - Bản đồ trường</title>

    <link rel="stylesheet" href="indexStyle.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="page">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <!-- Logo -->
        <div class="logo-area">
            <img src="images/logo.png" alt="NTTU Logo">
        </div>


        <div class="header-right">

            <!-- Search -->
            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    placeholder="Search for something"
                >

            </div>


            <!-- Avatar -->
            <div class="profile-avatar">
                <img
                    src="images/avatar.png"
                    alt="Profile"
                >
            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <div class="main">


        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <nav class="menu">

                <!-- Home -->
                <a href="index.html" class="menu-item">

                    <i class="fa-solid fa-house"></i>

                    <span>Home</span>

                </a>


                <!-- Map -->
                <a href="map.html" class="menu-item active">

                    <i class="fa-solid fa-map"></i>

                    <span>Bản đồ trường</span>

                </a>


                <!-- Accounts -->
                <a href="#" class="menu-item">

                    <i class="fa-solid fa-user"></i>

                    <span>Accounts</span>

                </a>


                <!-- Subjects -->
                <a href="#" class="menu-item">

                    <i class="fa-solid fa-book-open"></i>

                    <span>Môn học</span>

                </a>


                <!-- Community -->
                <a href="#" class="menu-item">

                    <i class="fa-solid fa-users"></i>

                    <span>Cộng đồng</span>

                </a>


                <!-- Ranking -->
                <a href="#" class="menu-item">

                    <i class="fa-solid fa-ranking-star"></i>

                    <span>Xếp hạng</span>

                </a>


                <!-- Setting -->
                <a href="#" class="menu-item">

                    <i class="fa-solid fa-gear"></i>

                    <span>Setting</span>

                </a>

            </nav>

        </aside>


        <!-- ================= CONTENT ================= -->

        <main class="content map-content">


            <!-- Map -->

            <div class="map-wrapper">

                <img
                    src="images/map.webp"
                    alt="Bản đồ trường NTTU"
                    class="campus-map"
                >


                <!-- ================= LEGEND ================= -->

                <div class="map-legend">


                    <!-- Tret -->

                    <div class="legend-item">

                        <div class="legend-color tret"></div>

                        <span>Trệt</span>

                    </div>


                    <!-- Tang 1 -->

                    <div class="legend-item">

                        <div class="legend-color tang1"></div>

                        <span>Tầng 1</span>

                    </div>


                    <!-- Cau thang -->

                    <div class="legend-item">

                        <div class="legend-color stair"></div>

                        <span>Cầu thang</span>

                    </div>


                </div>

            </div>

        </main>

    </div>

</div>

</body>

</html>
